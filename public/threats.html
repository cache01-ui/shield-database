<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S.H.I.E.L.D. Secure Archive — Матриця загроз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo1.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="terminal-container">

    <header class="top-nav">
      <p class="system-title">S.H.I.E.L.D. // БАЗА ДАНИХ [РІВЕНЬ ДОСТУПУ 7]</p>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">☰ МЕНЮ</button>
      <nav class="tabs-group" id="main-nav" aria-label="Розділи бази даних">
        <a href="dossier.html" class="tab-link">ДОСЬЄ</a>
        <a href="threats.html" class="tab-link active" aria-current="page">МАТРИЦЯ ЗАГРОЗ</a>
        <a href="incidents.html" class="tab-link">ІНЦИДЕНТИ</a>
        <a href="artifacts.html" class="tab-link">АРТЕФАКТИ</a>
        <a href="reports.html" class="tab-link">РАПОРТИ</a>
      </nav>
    </header>

    <div class="search-panel" role="search">
      <label for="threat-search" class="visually-hidden">Пошук загроз</label>
      <input id="threat-search" class="search-input" type="search" placeholder="[ ПОШУК ЗА ПРІЗВИЩЕМ / ПОЗИВНИМ / ID... ]">
      <div class="catalog-tools">
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="view-toggle" role="group" aria-label="Вигляд каталогу">
          <button type="button" class="view-btn" data-view="grid" aria-pressed="true">СІТКА</button>
          <button type="button" class="view-btn" data-view="list" aria-pressed="false">СПИСОК</button>
        </div>
      </div>
    </div>

    <h1 class="visually-hidden">Матриця загроз</h1>
    <main class="cards-row threat-grid" id="threat-grid"></main>

    <footer class="page-footer">
      <a href="index.html" class="logout-btn">ЗАВЕРШИТИ СЕСІЮ // ВИХІД</a>
    </footer>

  </div>
  <script src="ui.js"></script>
  <script src="api.js"></script>
  <script src="threats.js"></script>
</body>
</html>
