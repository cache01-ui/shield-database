<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S.H.I.E.L.D. Secure Archive — Польові рапорти</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="logo1.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="terminal-container">

    <header class="top-nav">
      <p class="system-title">S.H.I.E.L.D. // БАЗА ДАНИХ [РІВЕНЬ ДОСТУПУ 7]</p>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">☰ МЕНЮ</button>
      <nav class="tabs-group" id="main-nav" aria-label="Розділи бази даних">
        <a href="dossier.html" class="tab-link">ДОСЬЄ</a>
        <a href="threats.html" class="tab-link">МАТРИЦЯ ЗАГРОЗ</a>
        <a href="incidents.html" class="tab-link">ІНЦИДЕНТИ</a>
        <a href="artifacts.html" class="tab-link">АРТЕФАКТИ</a>
        <a href="reports.html" class="tab-link active" aria-current="page">РАПОРТИ</a>
      </nav>
    </header>

    <div class="filter-bar report-toolbar" role="search">
      <label for="report-search" class="visually-hidden">Пошук рапортів</label>
      <input type="search" id="report-search" class="search-input report-search" placeholder="[ ПОШУК: ЗАГОЛОВОК / АГЕНТ / ЛОКАЦІЯ ]">
      <label for="report-status">СТАТУС:</label>
      <select id="report-status">
        <option value="">УСІ</option>
        <option value="draft">ЧЕРНЕТКА</option>
        <option value="active">АКТИВНИЙ</option>
        <option value="closed">ЗАКРИТИЙ</option>
      </select>
      <label for="report-priority">ПРІОРИТЕТ:</label>
      <select id="report-priority">
        <option value="">УСІ</option>
        <option value="low">НИЗЬКИЙ</option>
        <option value="medium">СЕРЕДНІЙ</option>
        <option value="high">ВИСОКИЙ</option>
        <option value="critical">КРИТИЧНИЙ</option>
      </select>
      <p class="result-count" id="result-count" aria-live="polite"></p>
      <button type="button" class="new-report-btn" id="new-report">+ НОВИЙ РАПОРТ</button>
    </div>

    <h1 class="visually-hidden">Польові рапорти агентів</h1>
    <main class="report-list" id="report-list" aria-busy="true"></main>

    <footer class="page-footer">
      <a href="index.html" class="logout-btn">ЗАВЕРШИТИ СЕСІЮ // ВИХІД</a>
    </footer>

  </div>

  <dialog class="report-dialog" id="report-dialog" aria-labelledby="report-dialog-title">
    <form class="report-form" id="report-form" method="dialog" novalidate>
      <h2 id="report-dialog-title">НОВИЙ РАПОРТ</h2>

      <div class="form-field">
        <label for="rf-title" class="field-label-text">ЗАГОЛОВОК *</label>
        <input id="rf-title" name="title" class="terminal-input" maxlength="120" aria-describedby="rf-title-error">
        <p class="field-error" id="rf-title-error" aria-live="polite"></p>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="rf-agent" class="field-label-text">АГЕНТ *</label>
          <input id="rf-agent" name="agent" class="terminal-input" placeholder="LVL7-COULSON" spellcheck="false" aria-describedby="rf-agent-error">
          <p class="field-error" id="rf-agent-error" aria-live="polite"></p>
        </div>
        <div class="form-field">
          <label for="rf-location" class="field-label-text">ЛОКАЦІЯ</label>
          <input id="rf-location" name="location" class="terminal-input" maxlength="120" aria-describedby="rf-location-error">
          <p class="field-error" id="rf-location-error" aria-live="polite"></p>
        </div>
      </div>

      <div class="form-row form-row-3">
        <div class="form-field">
          <label for="rf-priority" class="field-label-text">ПРІОРИТЕТ *</label>
          <select id="rf-priority" name="priority" class="terminal-input" aria-describedby="rf-priority-error">
            <option value="low">НИЗЬКИЙ</option>
            <option value="medium" selected>СЕРЕДНІЙ</option>
            <option value="high">ВИСОКИЙ</option>
            <option value="critical">КРИТИЧНИЙ</option>
          </select>
          <p class="field-error" id="rf-priority-error" aria-live="polite"></p>
        </div>
        <div class="form-field">
          <label for="rf-status" class="field-label-text">СТАТУС *</label>
          <select id="rf-status" name="status" class="terminal-input" aria-describedby="rf-status-error">
            <option value="draft">ЧЕРНЕТКА</option>
            <option value="active" selected>АКТИВНИЙ</option>
            <option value="closed">ЗАКРИТИЙ</option>
          </select>
          <p class="field-error" id="rf-status-error" aria-live="polite"></p>
        </div>
        <div class="form-field">
          <label for="rf-incident" class="field-label-text">ІНЦИДЕНТ</label>
          <select id="rf-incident" name="incidentId" class="terminal-input" aria-describedby="rf-incidentId-error">
            <option value="">— НЕ ПОВ’ЯЗАНО —</option>
          </select>
          <p class="field-error" id="rf-incidentId-error" aria-live="polite"></p>
        </div>
      </div>

      <div class="form-field">
        <label for="rf-body" class="field-label-text">ТЕКСТ РАПОРТУ * <span class="char-count" id="rf-body-count">0 / 4000</span></label>
        <textarea id="rf-body" name="body" class="terminal-input" rows="6" maxlength="4000" aria-describedby="rf-body-error"></textarea>
        <p class="field-error" id="rf-body-error" aria-live="polite"></p>
      </div>

      <p class="form-status" id="rf-status-box" role="status" aria-live="polite"></p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" id="rf-cancel">СКАСУВАТИ</button>
        <button type="submit" class="confirm-save" id="rf-submit">ЗБЕРЕГТИ</button>
      </div>
    </form>
  </dialog>

  <dialog class="confirm-dialog" id="delete-dialog" aria-labelledby="delete-title">
    <h2 id="delete-title">ВИДАЛИТИ РАПОРТ?</h2>
    <p class="confirm-text" id="delete-text"></p>
    <div class="confirm-actions">
      <button type="button" class="confirm-cancel" id="delete-cancel">СКАСУВАТИ</button>
      <button type="button" class="confirm-ok" id="delete-ok">ВИДАЛИТИ</button>
    </div>
  </dialog>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <script src="ui.js"></script>
  <script src="api.js"></script>
  <script src="reports.js"></script>
</body>
</html>
